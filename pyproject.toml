[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldsniper"
version = "1.1.0"
description = "GoldSniper: Leak-Free Gold Futures Data Pipeline, Cross-Market Lead-Lag Analytics, and Walk-Forward Forecasting Suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GoldSniper Analytics Team" }
]
keywords = [
    "gold",
    "forecasting",
    "time-series",
    "walk-forward",
    "streamlit",
    "plotly",
    "conformal-prediction",
    "macroeconomics"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
